apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-sindy-train
spec:
  backoffLimit: 0
  template:
    metadata:
      name: sindyffuse-sindy-train
    spec:
      restartPolicy: Never
      containers:
      - name: sindyffuse-sindy
        image: ncking/bige:latest
        workingDir: /mnt/SINDyffuse
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        - name: HUMANML3D_ROOT
          value: "/mnt/SINDyffuse/datasets/HumanML3D"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -eo pipefail
          eval "$(conda shell.bash hook)"
          set +u
          conda activate base
          set -u

          ENV_NAME="sindyffuse"
          ENV_FILE="/mnt/SINDyffuse/env/environment.yaml"
          if conda env list | grep -Eq "^(\*| )*[[:space:]]*${ENV_NAME}[[:space:]]"; then
            conda env update -n "${ENV_NAME}" -f "${ENV_FILE}" --prune
          else
            conda env create -n "${ENV_NAME}" -f "${ENV_FILE}"
          fi
          set +u
          conda activate "${ENV_NAME}"
          set -u
          export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          export PYTHONPATH="/mnt/SINDyffuse:${PYTHONPATH:-}"
          export OMP_NUM_THREADS=1
          export MKL_NUM_THREADS=1
          export OPENBLAS_NUM_THREADS=1

          python -c "import numpy as np; print('numpy', np.__version__, flush=True); assert int(np.__version__.split('.')[0]) < 2, 'need numpy<2 for nimblephysics'"

          test -d "${HUMANML3D_ROOT}/nimble_b3d" || { echo "Missing ${HUMANML3D_ROOT}/nimble_b3d (run preprocess first)"; exit 1; }

          EXP_TS="$(date +%Y%m%d_%H%M%S)"
          RUN_ROOT="/mnt/SINDyffuse/results/sindy_${EXP_TS}"
          mkdir -p "${RUN_ROOT}"

          NGPU=$(nvidia-smi -L | wc -l)
          if [ "${NGPU}" -gt 2 ]; then NGPU=2; fi
          echo "DDP nproc_per_node=${NGPU}"
          torchrun --standalone --nproc_per_node="${NGPU}" \
            -m sindy.train \
            --config /mnt/SINDyffuse/configs/train_sindy.json \
            --data_root "${HUMANML3D_ROOT}" \
            --output "${RUN_ROOT}" \
            --preload

          ln -sfn "${RUN_ROOT}" /mnt/SINDyffuse/results/sindy/latest

          {
            echo "model=sindy_bio"
            echo "run_root=${RUN_ROOT}"
            echo "entrypoint=python -m sindy.train"
            echo "bio_channels=22"
            echo "completed_at=$(date -Iseconds)"
          } > "${RUN_ROOT}/RUN_INFO.txt"

          echo "Done. SINDy L_bio training finished. Checkpoint: ${RUN_ROOT}"
        resources:
          limits:
            nvidia.com/gpu: 2
            memory: 64Gi
            cpu: "16"
          requests:
            nvidia.com/gpu: 2
            memory: 64Gi
            cpu: "16"
        volumeMounts:
        - name: biomech-ai
          mountPath: /mnt
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: biomech-ai
        persistentVolumeClaim:
          claimName: biomech-ai
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
