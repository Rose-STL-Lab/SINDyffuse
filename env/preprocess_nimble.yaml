# Nimble B3D preprocess (OpenSim MocoTrack) — full HumanML3D dataset.
#
# Production Moco defaults (MuscleActivationConfig). For ~29k motions use
# preprocess_nimble_sharded.yaml (8 parallel jobs) instead.
#
# Apply / monitor:
#   kubectl delete job sindyffuse-preprocess-nimble --ignore-not-found
#   kubectl apply -f /mnt/SINDyffuse/env/preprocess_nimble.yaml
#   kubectl get pods -l job-name=sindyffuse-preprocess-nimble -w
#   POD=$(kubectl get pods -l job-name=sindyffuse-preprocess-nimble -o jsonpath='{.items[0].metadata.name}')
#   kubectl logs "$POD" --timestamps -f
#
# If kubectl logs is empty, read the PVC log (survives pod deletion):
#   cat /mnt/SINDyffuse/logs/preprocess_nimble_latest.log
#
# Env overrides (optional):
#   MAX_MOTIONS=N           — cap motions (0 = all ~29k)
#   SKIP_EXISTING=1         — skip any motion that already has .b3d (IK-only counts)
#   SKIP_IF_MOCO_VALID=1    — resume: skip motions with valid Moco mask (recommended)
#   MOTION_SHARD_INDEX=N    — shard index (use sharded yaml for parallel jobs)
#   MOTION_SHARD_COUNT=K
#   MOCO_PARALLEL_MOTIONS=M — concurrent Moco solves per pod (default 1)
#   MOCO_NUM_THREADS=N      — optional override (default: auto from pod CPU limit)
#   MAX_MOTIONS=1           — single-motion smoke test
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-preprocess-nimble
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: sindyffuse-preprocess-nimble
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      containers:
      - name: sindyffuse-preprocess-nimble
        image: ncking/bige:latest
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/SINDyffuse
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: HUMANML3D_ROOT
          value: "/mnt/SINDyffuse/datasets/HumanML3D"
        - name: MAX_MOTIONS
          value: "0"
        - name: SKIP_EXISTING
          value: "0"
        - name: SKIP_IF_MOCO_VALID
          value: "1"
        - name: MOTION_SHARD_INDEX
          value: "0"
        - name: MOTION_SHARD_COUNT
          value: "1"
        - name: MOCO_PARALLEL_MOTIONS
          value: "1"
        - name: SKIP_CONDA_UPDATE
          value: "1"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -eo pipefail
          eval "$(conda shell.bash hook)"
          set +u
          conda activate base
          set -u

          ENV_NAME="sindyffuse"
          preprocess_deps_ok() {
            python -c "
          import numpy
          import opensim
          import nimblephysics
          from datasets.splits import all_motion_ids
          from datasets.nimble_dataset import compute_nimble_normalization_stats
          from nimble.export import export_motion_to_b3d
          " 2>/dev/null
          }
          install_preprocess_packages() {
            echo "Installing preprocess packages in ${ENV_NAME} ..."
            conda install -n "${ENV_NAME}" -y \
              -c conda-forge -c opensim-org \
              "numpy>=1.25,<1.26" \
              opensim=4.5.2 \
              "scipy>=1.11,<1.14" \
              scikit-learn joblib pillow packaging tqdm
            pip install -U nimblephysics
          }
          ensure_preprocess_env() {
            if ! conda env list | grep -Eq "^(\*| )*[[:space:]]*${ENV_NAME}[[:space:]]"; then
              echo "Creating conda env ${ENV_NAME} (python 3.11) ..."
              conda create -n "${ENV_NAME}" -y python=3.11 pip
            fi
            set +u
            conda activate "${ENV_NAME}"
            set -u
            if preprocess_deps_ok; then
              if [ "${SKIP_CONDA_UPDATE:-0}" = "1" ]; then
                echo "SKIP_CONDA_UPDATE=1 and preprocess deps present; skipping install"
              else
                echo "Preprocess deps present; refreshing packages ..."
                install_preprocess_packages
              fi
              return 0
            fi
            echo "Preprocess deps missing in ${ENV_NAME} (installing even if SKIP_CONDA_UPDATE=1) ..."
            install_preprocess_packages
          }
          ensure_preprocess_env
          export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          export PYTHONPATH="/mnt/SINDyffuse:${PYTHONPATH:-}"

          cd /mnt/SINDyffuse
          echo "python=$(which python) CONDA_PREFIX=${CONDA_PREFIX}"

          python -c "import numpy as np; print('numpy', np.__version__, flush=True); assert int(np.__version__.split('.')[0]) < 2, 'need numpy<2 for nimblephysics'"
          python -c "import nimblephysics; print('nimblephysics ok', flush=True)"
          python -c "import opensim as osim; print('opensim', osim.GetVersion(), flush=True); assert hasattr(osim, 'MocoTrack'), 'Moco not available'"
          python -c "from datasets.splits import all_motion_ids; from datasets.nimble_dataset import compute_nimble_normalization_stats; from nimble.export import export_motion_to_b3d; print('preprocess imports ok', flush=True)"

          for f in train.txt val.txt test.txt; do
            test -f "${HUMANML3D_ROOT}/${f}" || { echo "Missing ${HUMANML3D_ROOT}/${f}"; exit 1; }
          done
          if [ ! -d "${HUMANML3D_ROOT}/new_joints" ] && [ ! -d "${HUMANML3D_ROOT}/new_joint_vecs" ]; then
            echo "Missing ${HUMANML3D_ROOT}/new_joints or new_joint_vecs"
            exit 1
          fi

          B3D_SUBDIR="nimble_b3d"
          MAX_MOTIONS="${MAX_MOTIONS:-0}"
          SKIP_EXISTING="${SKIP_EXISTING:-0}"
          SKIP_IF_MOCO_VALID="${SKIP_IF_MOCO_VALID:-1}"
          MOTION_SHARD_INDEX="${MOTION_SHARD_INDEX:-0}"
          MOTION_SHARD_COUNT="${MOTION_SHARD_COUNT:-1}"
          MOCO_PARALLEL_MOTIONS="${MOCO_PARALLEL_MOTIONS:-1}"
          EXTRA_MAX=()
          EXTRA_SKIP=()
          EXTRA_MOCO_SKIP=()
          EXTRA_SHARD=()
          EXTRA_PARALLEL=()
          if [ "${MAX_MOTIONS}" != "0" ]; then
            EXTRA_MAX=(--max_motions "${MAX_MOTIONS}")
          fi
          if [ "${SKIP_EXISTING}" = "1" ]; then
            EXTRA_SKIP=(--skip_existing)
          fi
          if [ "${SKIP_IF_MOCO_VALID}" = "1" ]; then
            EXTRA_MOCO_SKIP=(--skip_if_moco_valid)
          fi
          if [ "${MOTION_SHARD_COUNT}" != "1" ]; then
            EXTRA_SHARD=(--motion_shard_index "${MOTION_SHARD_INDEX}" --motion_shard_count "${MOTION_SHARD_COUNT}")
          fi
          if [ "${MOCO_PARALLEL_MOTIONS}" != "1" ]; then
            EXTRA_PARALLEL=(--moco_parallel_motions "${MOCO_PARALLEL_MOTIONS}")
          fi

          python - <<PY
          import os
          from pathlib import Path
          from datasets.splits import all_motion_ids
          root = Path(os.environ["HUMANML3D_ROOT"])
          ids = all_motion_ids(root)
          n = int(os.environ.get("MAX_MOTIONS", "0"))
          if n > 0:
              ids = ids[:n]
          shard_count = int(os.environ.get("MOTION_SHARD_COUNT", "1"))
          shard_index = int(os.environ.get("MOTION_SHARD_INDEX", "0"))
          if shard_count > 1:
              ids = [mid for i, mid in enumerate(ids) if i % shard_count == shard_index]
          b3d = root / "nimble_b3d"
          existing = sum(1 for mid in ids if (b3d / f"{mid}.b3d").is_file())
          manifest = f"preprocess_manifest_nimble_b3d"
          if shard_count > 1:
              manifest += f"_shard{shard_index}of{shard_count}"
          print("=== Nimble B3D preprocess (MocoTrack, optimized) ===")
          print(f"  motions_to_process: {len(ids)} (MAX_MOTIONS={os.environ.get('MAX_MOTIONS', '0')}, 0=all)")
          print(f"  shard: {shard_index}/{shard_count}")
          print(f"  already_have_b3d: {existing}")
          print(f"  skip_existing: {os.environ.get('SKIP_EXISTING', '0')}")
          print(f"  skip_if_moco_valid: {os.environ.get('SKIP_IF_MOCO_VALID', '1')}")
          from common.cpu import detect_usable_cpus, resolve_preprocess_parallelism
          parallel = int(os.environ.get("MOCO_PARALLEL_MOTIONS", "1"))
          workers, moco_thr = resolve_preprocess_parallelism(
              64, skip_muscle_activation=False, moco_parallel_motions=parallel
          )
          print(f"  motion_workers: {workers}, moco_threads each: {moco_thr} (usable_cpus={detect_usable_cpus()})")
          print(f"  logs: /mnt/SINDyffuse/logs/preprocess_nimble_latest.log")
          print(f"  manifest: {root}/{manifest}.jsonl")
          PY

          python scripts/preprocess_nimble.py \
            --hml_root "${HUMANML3D_ROOT}" \
            --out_root "${HUMANML3D_ROOT}" \
            --b3d_subdir "${B3D_SUBDIR}" \
            --log_dir "/mnt/SINDyffuse/logs" \
            --num_workers 64 \
            "${EXTRA_MAX[@]}" \
            "${EXTRA_SKIP[@]}" \
            "${EXTRA_MOCO_SKIP[@]}" \
            "${EXTRA_SHARD[@]}" \
            "${EXTRA_PARALLEL[@]}" \
            --opensim_log_level Off \
            --moco_min_frames 20 \
            --moco_min_ik_success_fraction 0.5 \
            --moco_min_success_fraction 0 \
            --moco_allow_low_valid

          test -d "${HUMANML3D_ROOT}/${B3D_SUBDIR}" || { echo "Missing ${B3D_SUBDIR} output dir"; exit 1; }

          MANIFEST="${HUMANML3D_ROOT}/preprocess_manifest_${B3D_SUBDIR}"
          if [ "${MOTION_SHARD_COUNT}" != "1" ]; then
            MANIFEST="${MANIFEST}_shard${MOTION_SHARD_INDEX}of${MOTION_SHARD_COUNT}"
          fi
          MANIFEST="${MANIFEST}.jsonl"
          test -f "${MANIFEST}" || { echo "Missing ${MANIFEST}"; exit 1; }
          B3D_COUNT=$(find "${HUMANML3D_ROOT}/${B3D_SUBDIR}" -maxdepth 1 -name '*.b3d' | wc -l)
          echo "Wrote ${B3D_COUNT} .b3d file(s) under ${B3D_SUBDIR}/"
          echo "--- manifest (last 10 lines) ---"
          tail -n 10 "${MANIFEST}" || true
          echo "Preprocess complete: ${HUMANML3D_ROOT}/${B3D_SUBDIR}"
        resources:
          limits:
            memory: 32Gi
            cpu: "64"
          requests:
            memory: 32Gi
            cpu: "64"
        volumeMounts:
        - name: biomech-ai
          mountPath: /mnt
      volumes:
      - name: biomech-ai
        persistentVolumeClaim:
          claimName: biomech-ai
