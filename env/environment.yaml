# SINDyffuse: diffusion + SINDy + Nimble physics + OpenSim (future experiments).
# OpenSim 4.5.2 (py311np125) requires numpy 1.25.x; SINDyffuse stays on numpy 1.x (<2).
name: sindyffuse
channels:
  - pytorch
  - nvidia
  - conda-forge
  - opensim-org
dependencies:
  - python=3.11
  - numpy>=1.25,<1.26
  - opensim=4.5.2
  - scipy>=1.11
  - scikit-learn>=1.3
  - joblib>=1.3
  - pillow>=10.0
  - matplotlib>=3.8
  - imageio>=2.34
  - pyvista>=0.43
  - packaging>=23.0
  - tqdm>=4.66
  - pyyaml>=6.0
  - requests>=2.31
  - seaborn>=0.13
  - pandas>=2.0,<3
  # CasADi is installed deterministically in Dockerfile via pip (3.7.1).
  - pip
  - pytorch>=2.2
  - pytorch-cuda=12.4
  - torchvision
  - torchaudio
  - pip:
      - nimblephysics
      - polyscope>=2.3.0
      - clip @ git+https://github.com/openai/CLIP.git
      - ftfy
      - regex
      - musint>=0.1
      - numpy>=1.25,<1.26
