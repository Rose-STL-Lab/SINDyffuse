# SINDyffuse: diffusion + SINDy + OpenSim / OpenSimAD (LaiUhlrich2022).
# OpenSim 4.5.2 (py311np125) requires numpy 1.25.x.
name: sindyffuse
channels:
  - pytorch
  - nvidia
  - conda-forge
  - opensim-org
dependencies:
  - python=3.11
  - numpy>=1.25,<1.26
  - opensim=4.5.2
  - scipy>=1.11
  - scikit-learn>=1.3
  - joblib>=1.3
  - pillow>=10.0
  - matplotlib>=3.8
  - imageio>=2.34
  - pyvista>=0.43
  - packaging>=23.0
  - tqdm>=4.66
  - pyyaml>=6.0
  - requests>=2.31
  - seaborn>=0.13
  - pandas>=2.0,<3
  - pip
  - pytorch>=2.2
  - pytorch-cuda=12.4
  - torchvision
  - torchaudio
  # CasADi is not listed here: opensim may pull a conda casadi that conflicts with
  # OpenSimAD. env/Dockerfile removes conda casadi and pins pip casadi==3.7.1.
  - pip:
      - polyscope>=2.3.0
      - clip @ git+https://github.com/openai/CLIP.git
      - ftfy
      - regex
      - musint>=0.1
      - numpy>=1.25,<1.26
