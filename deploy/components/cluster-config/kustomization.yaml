# Cluster template — edit image and PVC for your environment (all jobs + dev pod).
#
#   images.newName / newTag  → Docker Hub image (default: ncking/sindyffuse on Nautilus)
#   pvc-patch*.yaml          → claimName on the sindyffuse PVC
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

images:
  - name: sindyffuse
    newName: ncking/sindyffuse
    newTag: latest

patches:
  - path: pvc-patch.yaml
    target:
      kind: Job
  - path: pvc-patch-pod.yaml
    target:
      kind: Pod
  - target:
      kind: Job
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Pod
    patch: |-
      - op: replace
        path: /spec/containers/0/imagePullPolicy
        value: Always
