# Apply: kubectl apply -k deploy/jobs/benchmark-moco-parallel
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-benchmark-moco-parallel
  labels:
    app: sindyffuse-benchmark-moco-parallel
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: sindyffuse-benchmark-moco-parallel
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      containers:
      - name: sindyffuse-benchmark-moco-parallel
        image: sindyffuse:latest
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/SINDyffuse
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: HUMANML3D_ROOT
          value: "/mnt/SINDyffuse/datasets/HumanML3D"
        - name: BENCHMARK_NUM_WORKERS
          value: "64"
        - name: BENCHMARK_PARALLEL
          value: "1 2 4 8 16 32 64"
        - name: BENCHMARK_NUM_MOTIONS
          value: "64"
        - name: BENCHMARK_NUM_FRAMES
          value: "25"
        - name: BENCHMARK_WARMUP
          value: "0"
        - name: BENCHMARK_FROM_B3D
          value: "1"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -eo pipefail
          eval "$(conda shell.bash hook)"
          set +u
          conda activate sindyffuse
          set -u

          export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          export PYTHONPATH=/mnt/SINDyffuse
          cd /mnt/SINDyffuse

          LOG_DIR=/mnt/SINDyffuse/logs
          OUT_JSON="${LOG_DIR}/benchmark_moco_parallel_latest.json"
          read -r -a PARALLEL <<< "${BENCHMARK_PARALLEL:-1 2 4 8 16 32 64}"

          ARGS=(
            scripts/benchmark_moco_parallel.py
            --hml_root "${HUMANML3D_ROOT}"
            --log_dir "${LOG_DIR}"
            --out_json "${OUT_JSON}"
            --num_workers "${BENCHMARK_NUM_WORKERS:-64}"
            --parallel "${PARALLEL[@]}"
            --num_motions "${BENCHMARK_NUM_MOTIONS:-4}"
            --num_frames "${BENCHMARK_NUM_FRAMES:-25}"
          )
          [ "${BENCHMARK_WARMUP:-0}" = "1" ] && ARGS+=(--warmup)
          if [ "${BENCHMARK_FROM_B3D:-1}" = "1" ]; then
            ARGS+=(--from_b3d)
          else
            ARGS+=(--no-from_b3d)
          fi

          echo "=== benchmark start $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
          echo "argv: python ${ARGS[*]}"
          python "${ARGS[@]}"
          echo "=== benchmark done $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

          test -f "${OUT_JSON}"
          test -L "${LOG_DIR}/benchmark_moco_parallel.log" \
            || test -f "${LOG_DIR}/benchmark_moco_parallel.log"
        resources:
          limits:
            memory: 64Gi
            cpu: "64"
          requests:
            memory: 64Gi
            cpu: "64"
        volumeMounts:
        - name: data
          mountPath: /mnt
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: biomech-ai
