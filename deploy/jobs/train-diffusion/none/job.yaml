# Apply: kubectl apply -k deploy/jobs/train-diffusion/none
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-diffusion-train-none
  labels:
    app: sindyffuse-diffusion-train-none
    guidance: none
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: sindyffuse-diffusion-train-none
        guidance: none
    spec:
      restartPolicy: Never
      containers:
      - name: sindyffuse-diffusion
        image: sindyffuse:latest
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/SINDyffuse
        env:
        - name: NPROC_PER_NODE
          value: "1"
        command: ["/bin/bash", "-c"]
        args:
        - |
          source deploy/scripts/job-env.sh
          python scripts/train_diffusion.py --guidance none --preload
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: 64Gi
            cpu: "16"
          requests:
            nvidia.com/gpu: 1
            memory: 64Gi
            cpu: "16"
        volumeMounts:
        - name: data
          mountPath: /mnt
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sindyffuse
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
