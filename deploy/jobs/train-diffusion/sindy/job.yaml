# Apply: kubectl apply -k deploy/jobs/train-diffusion/sindy
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-diffusion-train-sindy
  labels:
    app: sindyffuse-diffusion-train-sindy
    guidance: sindy
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: sindyffuse-diffusion-train-sindy
        guidance: sindy
    spec:
      restartPolicy: Never
      containers:
      - name: sindyffuse-diffusion
        image: sindyffuse:latest
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/SINDyffuse
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -eo pipefail
          eval "$(conda shell.bash hook)"
          conda activate sindyffuse
          export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          export PYTHONPATH=/mnt/SINDyffuse
          export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
          export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
          HML=/mnt/SINDyffuse/datasets/HumanML3D
          SINDY=/mnt/SINDyffuse/results/sindy/latest
          test -d "${HML}/nimble_b3d" || { echo "Missing ${HML}/nimble_b3d"; exit 1; }
          test -f "${SINDY}/text_to_xi.pt" || { echo "Missing ${SINDY}/text_to_xi.pt"; exit 1; }
          RUN=/mnt/SINDyffuse/results/diffusion_sindy_$(date +%Y%m%d_%H%M%S)
          mkdir -p "${RUN}"
          CFG="${RUN}/config_resolved.json"
          python - <<PY
          import json
          from pathlib import Path
          repo = Path("/mnt/SINDyffuse")
          cfg = json.loads((repo / "configs/train_diffusion.json").read_text(encoding="utf-8"))
          cfg.setdefault("train", {})["guidance"] = "sindy"
          cfg.setdefault("data", {})["data_root"] = str(repo / "datasets/HumanML3D")
          cfg.setdefault("data", {})["dataset"] = "nimble"
          cfg.setdefault("train", {})["sindy_checkpoint_dir"] = str(repo / "results/sindy/latest")
          Path("${RUN}/config_resolved.json").write_text(json.dumps(cfg, indent=2), encoding="utf-8")
          PY
          NGPU=$(nvidia-smi -L | wc -l)
          [ "${NGPU}" -gt 2 ] && NGPU=2
          torchrun --standalone --nproc_per_node="${NGPU}" \
            scripts/train_diffusion.py \
            --config "${CFG}" \
            --out_dir "${RUN}" \
            --preload
        resources:
          limits:
            nvidia.com/gpu: 2
            memory: 64Gi
            cpu: "16"
          requests:
            nvidia.com/gpu: 2
            memory: 64Gi
            cpu: "16"
        volumeMounts:
        - name: data
          mountPath: /mnt
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: biomech-ai
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
