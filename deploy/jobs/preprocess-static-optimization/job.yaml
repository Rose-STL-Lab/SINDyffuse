# Apply: kubectl apply -k deploy/jobs/preprocess-static-optimization
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-preprocess-nimble
  labels:
    app: sindyffuse-preprocess-nimble
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: sindyffuse-preprocess-nimble
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      containers:
      - name: sindyffuse-preprocess-nimble
        image: sindyffuse:latest
        imagePullPolicy: IfNotPresent
        workingDir: /workspace/SINDyffuse
        env:
        - name: MAX_MOTIONS
          value: "0"
        - name: SKIP_EXISTING
          value: "1"
        - name: PREPROCESS_NUM_WORKERS
          value: "64"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -eo pipefail
          eval "$(conda shell.bash hook)"
          conda activate sindyffuse
          export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          export PYTHONPATH=/workspace/SINDyffuse
          HML=/workspace/SINDyffuse/datasets/HumanML3D
          ARGS=(
            scripts/preprocess_nimble.py
            --hml_root "${HML}"
            --out_root "${HML}"
            --log_dir /workspace/SINDyffuse/logs
            --activation_method static_optimization
            --num_workers "${PREPROCESS_NUM_WORKERS:-64}"
            --opensim_log_level Off
          )
          [ "${MAX_MOTIONS:-0}" != "0" ] && ARGS+=(--max_motions "${MAX_MOTIONS}")
          [ "${SKIP_EXISTING:-1}" = "1" ] && ARGS+=(--skip_existing)
          python "${ARGS[@]}"
          test -d "${HML}/nimble_b3d"
          test -f "${HML}/preprocess_manifest.jsonl"
        resources:
          limits:
            memory: 64Gi
            cpu: "64"
          requests:
            memory: 64Gi
            cpu: "64"
        volumeMounts:
        - name: data
          mountPath: /workspace
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: biomech-ai
