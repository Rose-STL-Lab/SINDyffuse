# Apply: kubectl apply -k deploy/jobs/preprocess-nimble/normalization
#
# Merges shard preprocess manifests and writes nimble_b3d/Mean.npy + Std.npy.
# Run after preprocess workers finish (or alone if shard manifests already exist).
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-compute-normalization
  labels:
    app: sindyffuse-compute-normalization
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: sindyffuse-compute-normalization
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      containers:
      - name: sindyffuse-compute-normalization
        image: sindyffuse:latest
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/SINDyffuse
        env:
        - name: PREPROCESS_NUM_SHARDS
          value: "64"
        - name: SINDYFFUSE_RUN_LOG_ID
          value: "RUN_LOG_ID_PLACEHOLDER"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -eo pipefail
          eval "$(conda shell.bash hook)"
          conda activate sindyffuse
          export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          export PYTHONPATH=/mnt/SINDyffuse
          HML=/mnt/SINDyffuse/datasets/HumanML3D
          NUM_SHARDS="${PREPROCESS_NUM_SHARDS:-64}"
          test -d "${HML}/nimble_b3d" || { echo "Missing ${HML}/nimble_b3d"; exit 1; }
          python scripts/compute_normalization.py \
            --out_root "${HML}" \
            --num_shards "${NUM_SHARDS}" \
            --log_dir /mnt/SINDyffuse/logs
          test -f "${HML}/nimble_b3d/Mean.npy"
          test -f "${HML}/nimble_b3d/Std.npy"
        resources:
          limits:
            memory: 2Gi
            cpu: "1"
          requests:
            memory: 2Gi
            cpu: "1"
        volumeMounts:
        - name: data
          mountPath: /mnt
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sindyffuse
