# Worker phase: kubectl apply -k deploy/jobs/preprocess-nimble/static-optimization
# Full pipeline: ./deploy/scripts/run-preprocess-nimble.sh static-optimization
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-preprocess-static-optimization
  labels:
    app: sindyffuse-preprocess-static-optimization
    activation-method: static-optimization
spec:
  parallelism: 64
  completions: 64
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: sindyffuse-preprocess-static-optimization
        activation-method: static-optimization
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      containers:
      - name: sindyffuse-preprocess-static-optimization
        image: sindyffuse:latest
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/SINDyffuse
        env:
        - name: PREPROCESS_NUM_SHARDS
          value: "64"
        - name: ACTIVATION_METHOD
          value: "static_optimization"
        - name: MAX_MOTIONS
          value: "0"
        - name: SKIP_EXISTING
          value: "1"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -eo pipefail
          eval "$(conda shell.bash hook)"
          conda activate sindyffuse
          export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          export PYTHONPATH=/mnt/SINDyffuse
          HML=/mnt/SINDyffuse/datasets/HumanML3D
          NUM_SHARDS="${PREPROCESS_NUM_SHARDS:-64}"
          ARGS=(
            scripts/preprocess_nimble.py
            --hml_root "${HML}"
            --out_root "${HML}"
            --log_dir /mnt/SINDyffuse/logs
            --num_shards "${NUM_SHARDS}"
            --shard_index "${JOB_COMPLETION_INDEX}"
            --num_workers 1
            --activation_method "${ACTIVATION_METHOD:-static_optimization}"
            --skip_normalization
            --opensim_log_level Off
          )
          [ "${MAX_MOTIONS:-0}" != "0" ] && ARGS+=(--max_motions "${MAX_MOTIONS}")
          [ "${SKIP_EXISTING:-1}" = "1" ] && ARGS+=(--skip_existing)
          python "${ARGS[@]}"
          test -f "${HML}/preprocess_manifest.$(printf '%04d' "${JOB_COMPLETION_INDEX}").jsonl"
        resources:
          limits:
            memory: 2Gi
            cpu: "1"
          requests:
            memory: 2Gi
            cpu: "1"
        volumeMounts:
        - name: data
          mountPath: /mnt
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sindyffuse
