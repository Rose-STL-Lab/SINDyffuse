# Worker phase: kubectl apply -k deploy/jobs/preprocess-nimble/static-optimization
# Full pipeline: ./deploy/scripts/run-preprocess-nimble.sh static-optimization
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-preprocess-static-optimization
  labels:
    app: sindyffuse-preprocess-static-optimization
    activation-method: static-optimization
spec:
  parallelism: 64
  completions: 64
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: sindyffuse-preprocess-static-optimization
        activation-method: static-optimization
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      containers:
      - name: sindyffuse-preprocess-static-optimization
        image: sindyffuse:latest
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/SINDyffuse
        env:
        - name: PREPROCESS_NUM_SHARDS
          value: "64"
        - name: ACTIVATION_METHOD
          value: "static_optimization"
        - name: MAX_MOTIONS
          value: "0"
        - name: SKIP_EXISTING
          value: "0"
        - name: SINDYFFUSE_RUN_LOG_ID
          value: "RUN_LOG_ID_PLACEHOLDER"
        command: ["/bin/bash", "deploy/scripts/preprocess-k8s-worker.sh"]
        resources:
          limits:
            memory: 6Gi
            cpu: "1"
          requests:
            memory: 6Gi
            cpu: "1"
        volumeMounts:
        - name: data
          mountPath: /mnt
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sindyffuse
