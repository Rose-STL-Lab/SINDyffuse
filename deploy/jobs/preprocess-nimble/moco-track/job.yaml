# Worker phase: kubectl apply -k deploy/jobs/preprocess-nimble/moco-track
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-preprocess-moco-track
  labels:
    app: sindyffuse-preprocess-moco-track
    activation-method: moco-track
spec:
  parallelism: 180
  completions: 180
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: sindyffuse-preprocess-moco-track
        activation-method: moco-track
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      containers:
      - name: sindyffuse-preprocess-moco-track
        image: sindyffuse:latest
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/SINDyffuse
        env:
        - name: PREPROCESS_NUM_SHARDS
          value: "180"
        - name: ACTIVATION_METHOD
          value: "moco_track"
        - name: MOCO_CORE_DURATION_S
          value: "1.4"
        - name: MOCO_BUFFER_DURATION_S
          value: "0.14"
        - name: MAX_MOTIONS
          value: "0"
        - name: SKIP_EXISTING
          value: "1"
        - name: SINDYFFUSE_RUN_LOG_ID
          value: "RUN_LOG_ID_PLACEHOLDER"
        command: ["/bin/bash", "-c"]
        args:
        - |
          source deploy/scripts/job-env.sh
          python scripts/preprocess_nimble.py --skip_normalization --num_workers 0
        resources:
          limits:
            memory: 8Gi
            cpu: "8"
          requests:
            memory: 8Gi
            cpu: "8"
        volumeMounts:
        - name: data
          mountPath: /mnt
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sindyffuse
