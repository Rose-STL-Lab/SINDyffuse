# Worker phase: kubectl apply -k deploy/jobs/preprocess-nimble/none
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-preprocess-none
  labels:
    app: sindyffuse-preprocess-none
    activation-method: none
spec:
  parallelism: 64
  completions: 64
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: sindyffuse-preprocess-none
        activation-method: none
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      containers:
      - name: sindyffuse-preprocess-none
        image: sindyffuse:latest
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/SINDyffuse
        env:
        - name: PREPROCESS_NUM_SHARDS
          value: "64"
        - name: ACTIVATION_METHOD
          value: "none"
        - name: MAX_MOTIONS
          value: "0"
        - name: SKIP_EXISTING
          value: "1"
        - name: SINDYFFUSE_RUN_LOG_ID
          value: "RUN_LOG_ID_PLACEHOLDER"
        command: ["/bin/bash", "-c"]
        args:
        - |
          source deploy/scripts/job-env.sh
          python scripts/preprocess_nimble.py --skip_normalization --num_workers 1
        resources:
          limits:
            memory: 2Gi
            cpu: "1"
          requests:
            memory: 2Gi
            cpu: "1"
        volumeMounts:
        - name: data
          mountPath: /mnt
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sindyffuse
