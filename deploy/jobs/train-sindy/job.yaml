# Apply: kubectl apply -k deploy/jobs/train-sindy
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-sindy-train
  labels:
    app: sindyffuse-sindy-train
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: sindyffuse-sindy-train
    spec:
      restartPolicy: Never
      containers:
      - name: sindyffuse-sindy
        image: sindyffuse:latest
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/SINDyffuse
        env:
        - name: NPROC_PER_NODE
          value: "2"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -eo pipefail
          eval "$(conda shell.bash hook)"
          conda activate sindyffuse
          export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          export PYTHONPATH=/mnt/SINDyffuse
          export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
          export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
          HML=/mnt/SINDyffuse/datasets/HumanML3D
          test -d "${HML}/nimble_b3d" || { echo "Missing ${HML}/nimble_b3d"; exit 1; }
          # SINDy training requires muscle_activations in B3D (preprocess with moco_track or static_optimization).
          RUN=/mnt/SINDyffuse/results/sindy_$(date +%Y%m%d_%H%M%S)
          mkdir -p "${RUN}"
          python -m sindy.train \
            --config /mnt/SINDyffuse/configs/train_sindy.json \
            --data_root "${HML}" \
            --output "${RUN}" \
            --preload
          ln -sfn "${RUN}" /mnt/SINDyffuse/results/sindy/latest
        resources:
          limits:
            nvidia.com/gpu: 2
            memory: 64Gi
            cpu: "16"
          requests:
            nvidia.com/gpu: 2
            memory: 64Gi
            cpu: "16"
        volumeMounts:
        - name: data
          mountPath: /mnt
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sindyffuse
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
