# Apply: kubectl apply -k deploy/jobs/normalize-dataset
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-normalize-dataset
  labels:
    app: sindyffuse-normalize-dataset
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: sindyffuse-normalize-dataset
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      containers:
      - name: sindyffuse-normalize-dataset
        image: sindyffuse:latest
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/SINDyffuse
        env:
        - name: SINDYFFUSE_RUN_LOG_ID
          value: "RUN_LOG_ID_PLACEHOLDER"
        command: ["/bin/bash", "-c"]
        args:
        - |
          source deploy/scripts/job-env.sh
          python scripts/compute_normalization.py
        resources:
          limits:
            memory: 2Gi
            cpu: "1"
          requests:
            memory: 2Gi
            cpu: "1"
        volumeMounts:
        - name: data
          mountPath: /mnt
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sindyffuse
