# Apply after all preprocess-mint worker shards finish.
# kubectl apply -k deploy/jobs/preprocess-mint/normalization
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-compute-normalization-mint
  labels:
    app: sindyffuse-compute-normalization-mint
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: sindyffuse-compute-normalization-mint
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      containers:
      - name: sindyffuse-compute-normalization-mint
        image: sindyffuse:latest
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/SINDyffuse
        env:
        - name: SINDYFFUSE_SKELETON
          value: "mint"
        - name: SINDYFFUSE_RUN_LOG_ID
          value: "RUN_LOG_ID_PLACEHOLDER"
        command: ["/bin/bash", "-c"]
        args:
        - |
          source deploy/scripts/job-env.sh
          python scripts/compute_normalization.py --skeleton mint
        resources:
          limits:
            memory: 4Gi
            cpu: "2"
          requests:
            memory: 4Gi
            cpu: "2"
        volumeMounts:
        - name: data
          mountPath: /mnt
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sindyffuse
