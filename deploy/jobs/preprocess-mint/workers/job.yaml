# Worker phase: kubectl apply -k deploy/jobs/preprocess-mint/workers
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-preprocess-mint
  labels:
    app: sindyffuse-preprocess-mint
spec:
  parallelism: 128
  completions: 128
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: nick-sindyffuse-preprocess-mint
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 600
      containers:
      - name: sindyffuse-preprocess-mint
        image: sindyffuse:latest
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/SINDyffuse
        env:
        - name: PREPROCESS_NUM_SHARDS
          value: "128"
        - name: SINDYFFUSE_SKELETON
          value: "mint"
        - name: MINT_ROOT
          value: "/mnt/MinT"
        - name: SMPLH_MODEL_PATH
          value: "/mnt/models/smplh"
        - name: MAX_MOTIONS
          value: "0"
        - name: SKIP_EXISTING
          value: "1"
        - name: SINDYFFUSE_RUN_LOG_ID
          value: "RUN_LOG_ID_PLACEHOLDER"
        command: ["/bin/bash", "-c"]
        args:
        - |
          source deploy/scripts/job-env.sh
          python scripts/preprocess_mint.py --skip_normalization --num_workers 1
        resources:
          limits:
            memory: 36Gi
            cpu: "4"
          requests:
            memory: 36Gi
            cpu: "4"
        volumeMounts:
        - name: data
          mountPath: /mnt
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sindyffuse
