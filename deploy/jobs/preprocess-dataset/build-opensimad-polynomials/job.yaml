# Indexed slice extraction. Run preparation first, then finalization (see orchestrator).
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-build-opensimad-polynomials
  labels:
    app: sindyffuse-build-opensimad-polynomials
spec:
  completionMode: Indexed
  completions: 200
  parallelism: 100
  backoffLimitPerIndex: 2
  maxFailedIndexes: 0
  template:
    metadata:
      labels:
        app: sindyffuse-build-opensimad-polynomials
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      containers:
      - name: sindyffuse-build-opensimad-polynomials
        image: sindyffuse:latest
        imagePullPolicy: Always
        workingDir: /mnt/SINDyffuse
        env:
        - name: MOCO_NUM_THREADS
          value: "1"
        - name: TMPDIR
          value: "/scratch"
        - name: SINDYFFUSE_RUN_LOG_ID
          value: build-opensimad-polynomials
        - name: POLYNOMIAL_BUILD_DIR
          value: /mnt/SINDyffuse/models/lai_uhlrich/opensimad/polynomial-builds/units-model-v2
        - name: POLYNOMIAL_EXPECTED_CHUNKS
          value: "200"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -eo pipefail
          mkdir -p /mnt/SINDyffuse/logs
          attempt="$(date -u +%Y%m%dT%H%M%SZ)_${HOSTNAME}"
          # Capture Python, worker, shell and native output on the PVC, not emptyDir.
          exec > >(tee -a "/mnt/SINDyffuse/logs/build-opensimad-polynomials_${attempt}.log") 2>&1
          echo "Polynomial attempt=${attempt} started=$(date -u +%FT%TZ)"
          source deploy/scripts/job-env.sh
          source deploy/scripts/ensure-casadi.sh
          mkdir -p /scratch/polynomial-cache
          python -u scripts/build_lai_opensimad_polynomials.py \
            --mode extract \
            --build_dir "${POLYNOMIAL_BUILD_DIR}" \
            --expected_chunks "${POLYNOMIAL_EXPECTED_CHUNKS}" \
            --num_threads "${MOCO_NUM_THREADS}" \
            --log_dir /mnt/SINDyffuse/logs \
            --work_dir /scratch/polynomial-cache
        resources:
          limits:
            memory: 256Gi
            cpu: "1"
          requests:
            memory: 256Gi
            cpu: "1"
        volumeMounts:
        - name: data
          mountPath: /mnt
        - name: scratch
          mountPath: /scratch
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sindyffuse
      - name: scratch
        emptyDir:
          sizeLimit: 64Gi