# Worker phase: OpenSimAD MinT activations on LaiUhlrich2022
# kubectl apply -k deploy/jobs/preprocess-dataset/moco-track
#
# Memory notes (do not raise parallel segments without raising limits):
# - CasADi NLP expand OFF (OPENSIMAD_EXPAND_NLP=0).
# - Bounds jacobian rewrite OFF (OPENSIMAD_BOUNDS_REWRITE=0); rewrite alone can OOM.
# - Workers require the compiled F.so and precomputed polynomial cache.
# - One motion per pod; at most 8 segments × 4 threads within its 32 CPU budget.
# - ensure-casadi.sh also installs requests (utilsOpenSimAD import).
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-preprocess-moco-track
  labels:
    app: sindyffuse-preprocess-moco-track
    activation-method: opensimad
    opensim-model: LaiUhlrich2022
spec:
  parallelism: 180
  completions: 29228
  completionMode: Indexed
  backoffLimitPerIndex: 2
  template:
    metadata:
      labels:
        app: sindyffuse-preprocess-moco-track
        activation-method: opensimad
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      containers:
      - name: sindyffuse-preprocess-moco-track
        image: sindyffuse:latest
        imagePullPolicy: Always
        workingDir: /mnt/SINDyffuse
        env:
        - name: PREPROCESS_NUM_SHARDS
          value: "180"
        - name: MAX_MOTIONS
          value: "0"
        - name: MOTION_TASK_MODE
          value: process
        - name: MOTION_TASK_DIR
          value: /mnt/SINDyffuse/datasets/HumanML3D/motion-tasks/default
        - name: MOTION_TASK_COUNT
          value: "29228"
        - name: ACTIVATION_METHOD
          value: "opensimad"
        - name: MOCO_MAX_ITERATIONS
          value: "2500"
        - name: MOCO_CONVERGENCE_TOLERANCE
          value: "0.001"
        - name: MOCO_MESH_INTERVAL
          value: "0.02"
        - name: MOCO_PARALLEL_SEGMENTS
          value: "8"
        - name: MOCO_NUM_THREADS
          value: "4"
        - name: MOCO_CPU_BUDGET
          value: "32"
        - name: MOCO_CORE_DURATION_S
          value: "1.4"
        - name: MOCO_BUFFER_DURATION_S
          value: "0.14"
        # Never enable unless you have 160Gi+ headroom; expand materializes the full SX NLP.
        - name: OPENSIMAD_EXPAND_NLP
          value: "0"
        # Legacy jacobian→bounds rewrite OOMs on MinT Lai; keep off.
        - name: OPENSIMAD_BOUNDS_REWRITE
          value: "0"
        - name: TMPDIR
          value: "/scratch"
        - name: MOCO_TEMP_DIR
          value: "/scratch"
        - name: SINDYFFUSE_RUN_LOG_ID
          value: "RUN_LOG_ID_PLACEHOLDER"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -eo pipefail
          mkdir -p /mnt/SINDyffuse/logs
          exec > >(tee -a "/mnt/SINDyffuse/logs/motion-task_${JOB_COMPLETION_INDEX:-prepare}_${HOSTNAME}.log") 2>&1
          source deploy/scripts/job-env.sh
          # Runtime repair for incomplete images (no env rebuild): pip casadi==3.7.1,
          # seaborn/pyyaml with deps under constraints.txt (pulls matplotlib; keeps numpy 1.25.x).
          # preprocess_moco.py imports casadi at module import time.
          source deploy/scripts/ensure-casadi.sh
          export SINDYFFUSE_RUN_LOG_ID="opensimad_motion_${JOB_COMPLETION_INDEX:-0}_${HOSTNAME}"
          mkdir -p "${TMPDIR:-/scratch}"
          python scripts/preprocess_moco.py --skip_normalization --num_workers 0 --activation_method opensimad
        resources:
          limits:
            memory: 32Gi
            cpu: "32"
          requests:
            memory: 32Gi
            cpu: "32"
        volumeMounts:
        - name: data
          mountPath: /mnt
        - name: scratch
          mountPath: /scratch
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sindyffuse
      - name: scratch
        emptyDir:
          sizeLimit: 32Gi
