# Apply: kubectl apply -k deploy/jobs/preprocess-dataset/fit-function-paths/convert
# (Usually launched by orchestrator Job after prepare completes.)
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-path-fit-convert
  labels:
    app: sindyffuse-path-fit-convert
spec:
  parallelism: 180
  completions: 180
  completionMode: Indexed
  backoffLimit: 32
  template:
    metadata:
      labels:
        app: sindyffuse-path-fit-convert
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      containers:
      - name: path-fit-convert
        image: sindyffuse:latest
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/SINDyffuse
        env:
        - name: PATH_FIT_NUM_SHARDS
          value: "180"
        command: ["/bin/bash", "-c"]
        args:
        - |
          source deploy/scripts/job-env.sh
          python scripts/fit_rajagopal_function_paths.py --phase convert --num_shards ${PATH_FIT_NUM_SHARDS} --num_workers 1
        resources:
          limits:
            memory: 2Gi
            cpu: "1"
          requests:
            memory: 2Gi
            cpu: "1"
        volumeMounts:
        - name: data
          mountPath: /mnt
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sindyffuse
