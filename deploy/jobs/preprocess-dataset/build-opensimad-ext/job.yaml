# One-shot: kubectl apply -k deploy/jobs/preprocess-dataset/build-opensimad-ext
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-build-opensimad-ext
  labels:
    app: sindyffuse-build-opensimad-ext
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app: sindyffuse-build-opensimad-ext
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      containers:
      - name: sindyffuse-build-opensimad-ext
        image: sindyffuse:latest
        imagePullPolicy: Always
        workingDir: /mnt/SINDyffuse
        env:
        - name: SINDYFFUSE_RUN_LOG_ID
          value: build-opensimad-ext
        command: ["/bin/bash", "-c"]
        args:
        - |
          source deploy/scripts/job-env.sh
          # Incomplete images/envs often lack pip casadi and vendor imports
          # (seaborn/pyyaml). Mirrors env/Dockerfile + environment.yaml pins.
          source deploy/scripts/ensure-casadi.sh
          # Production workers require the compiled external. Never substitute
          # the high-memory F.py expression graph.
          python scripts/build_lai_opensimad_ext.py --force --no_expression_graph
        resources:
          limits:
            memory: 128Gi
            cpu: "16"
          requests:
            memory: 128Gi
            cpu: "16"
        volumeMounts:
        - name: data
          mountPath: /mnt
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sindyffuse
