# Worker phase: kubectl apply -k deploy/jobs/preprocess-dataset/inverse_kinematics
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-preprocess-ik
  labels:
    app: sindyffuse-preprocess-ik
    activation-method: ik
spec:
  parallelism: 180
  completions: 180
  completionMode: Indexed
  backoffLimit: 64
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 36000
  template:
    metadata:
      labels:
        app: sindyffuse-preprocess-ik
        activation-method: ik
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      containers:
      - name: sindyffuse-preprocess-ik
        image: sindyffuse:latest
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/SINDyffuse
        env:
        - name: MAX_MOTIONS
          value: "0"
        - name: SINDYFFUSE_RUN_LOG_ID
          value: "RUN_LOG_ID_PLACEHOLDER"
        command: ["/bin/bash", "-c"]
        args:
        - |
          source deploy/scripts/job-env.sh
          export SINDYFFUSE_RUN_LOG_ID="ik_shard_${JOB_COMPLETION_INDEX:-0}"
          python scripts/preprocess_ik.py --skip_normalization --num_workers 4
        resources:
          limits:
            memory: 4Gi
            cpu: "4"
          requests:
            memory: 4Gi
            cpu: "4"
        volumeMounts:
        - name: data
          mountPath: /mnt
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sindyffuse
