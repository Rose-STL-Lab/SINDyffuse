# Apply: kubectl apply -k deploy/jobs/preprocess-dataset/normalization
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-compute-normalization
  labels:
    app: sindyffuse-compute-normalization
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: sindyffuse-compute-normalization
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      containers:
      - name: sindyffuse-compute-normalization
        image: sindyffuse:latest
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/SINDyffuse
        env:
        - name: SINDYFFUSE_RUN_LOG_ID
          value: "normalization"
        command: ["/bin/bash", "-c"]
        args:
        - |
          source deploy/scripts/job-env.sh
          python scripts/compute_normalization.py --wait --num_shards "${PREPROCESS_NUM_SHARDS}"
        resources:
          limits:
            memory: 2Gi
            cpu: "1"
          requests:
            memory: 2Gi
            cpu: "1"
        volumeMounts:
        - name: data
          mountPath: /mnt
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sindyffuse
