# Apply: kubectl apply -k deploy/jobs/preprocess-dataset/normalization
apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-compute-normalization
  labels:
    app: sindyffuse-compute-normalization
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: sindyffuse-compute-normalization
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      containers:
      - name: sindyffuse-compute-normalization
        image: sindyffuse:latest
        imagePullPolicy: IfNotPresent
        workingDir: /mnt/SINDyffuse
        env:
        - name: PREPROCESS_NUM_SHARDS
          value: "180"
        - name: MOTION_TASK_DIR
          value: /mnt/SINDyffuse/datasets/HumanML3D/motion-tasks/default
        - name: SINDYFFUSE_RUN_LOG_ID
          value: "RUN_LOG_ID_PLACEHOLDER"
        command: ["/bin/bash", "-c"]
        args:
        - |
          source deploy/scripts/job-env.sh
          python scripts/compute_normalization.py --motion_task_dir "${MOTION_TASK_DIR}"
        resources:
          limits:
            memory: 2Gi
            cpu: "1"
          requests:
            memory: 2Gi
            cpu: "1"
        volumeMounts:
        - name: data
          mountPath: /mnt
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sindyffuse
