# Apply: kubectl apply -k deploy/dev
# Shell:  kubectl exec -it sindyffuse-dev -- bash -l
apiVersion: v1
kind: Pod
metadata:
  name: sindyffuse-dev
  labels:
    app: sindyffuse-dev
spec:
  restartPolicy: Always
  containers:
  - name: sindyffuse-dev
    image: sindyffuse:latest
    imagePullPolicy: IfNotPresent
    stdin: true
    tty: true
    workingDir: /mnt/SINDyffuse
    command: ["/bin/bash", "-c"]
    args:
    - |
      if [[ -x /opt/conda/envs/sindyffuse/bin/id && ! -e /opt/conda/envs/sindyffuse/bin/opensim-id ]]; then
        mv /opt/conda/envs/sindyffuse/bin/id /opt/conda/envs/sindyffuse/bin/opensim-id
      fi
      grep -q sindyffuse /root/.bashrc 2>/dev/null || cat >> /root/.bashrc <<'EOF'
      eval "$(conda shell.bash hook)"
      conda activate sindyffuse
      export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH:}${CONDA_PREFIX}/lib"
      export PYTHONPATH=/mnt/SINDyffuse
      EOF
      exec sleep infinity
    resources:
      requests:
        cpu: "16"
        memory: 32Gi
        nvidia.com/gpu: 0
      limits:
        cpu: "16"
        memory: 32Gi
        nvidia.com/gpu: 0
    volumeMounts:
    - name: data
      mountPath: /mnt
  volumes:
  - name: data
    persistentVolumeClaim:
          claimName: sindyffuse
