# SINDyffuse: diffusion + SINDy + Nimble physics + OpenSim (future experiments).
# OpenSim 4.5.2 (py311np125) requires numpy 1.25.x; SINDyffuse stays on numpy 1.x (<2).
name: sindyffuse
channels:
  - pytorch
  - nvidia
  - conda-forge
  - opensim-org
dependencies:
  - python=3.11
  - numpy>=1.25,<1.26
  - opensim=4.5.2
  - scipy>=1.11
  - scikit-learn>=1.3
  - joblib>=1.3
  - pillow>=10.0
  - packaging>=23.0
  - tqdm>=4.66
  - pip
  - pytorch>=2.2
  - pytorch-cuda=12.4
  - torchvision
  - torchaudio
  - pip:
      - nimblephysics
      - clip @ git+https://github.com/openai/CLIP.git
      - ftfy
      - regex
      - wcwidth
