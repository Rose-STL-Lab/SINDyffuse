# Build and publish the SINDyffuse container to Docker Hub.
#
# Required repo secrets:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN   (Docker Hub access token with Read & Write)
name: Docker image

on:
  push:
    branches: [main]
    paths:
      - env/Dockerfile
      - env/environment.yaml
      - .github/workflows/docker-image.yml
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE: ncking/sindyffuse

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Conda + CUDA PyTorch needs ~20 GB peak disk during env create; free GHA defaults (~14 GB).
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: env/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
