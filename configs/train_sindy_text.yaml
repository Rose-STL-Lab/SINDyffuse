apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-sindy-text-train
spec:
  backoffLimit: 0
  template:
    metadata:
      name: sindyffuse-sindy-text-train
    spec:
      restartPolicy: Never
      containers:
      - name: sindyffuse-sindy-text
        image: ncking/bige:latest
        workingDir: /mnt
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        - name: HUMANML3D_ROOT
          value: "/mnt/BiomechAI/datasets/HumanML3D"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -eo pipefail
          eval "$(conda shell.bash hook)"
          set +u
          conda activate base
          set -u

          ENV_NAME="hml3d-diffusion"
          ENV_FILE="/mnt/BiomechAI/experiments/hml3d_diffusion_per_frame/environment.yaml"
          if conda env list | grep -Eq "^(\*| )*[[:space:]]*${ENV_NAME}[[:space:]]"; then
            conda env update -n "${ENV_NAME}" -f "${ENV_FILE}" --prune
          else
            conda env create -n "${ENV_NAME}" -f "${ENV_FILE}"
          fi
          set +u
          conda activate "${ENV_NAME}"
          set -u
          export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir git+https://github.com/openai/CLIP.git

          cd /mnt/SINDyffuse
          test -f "${HUMANML3D_ROOT}/train.txt" || { echo "Missing ${HUMANML3D_ROOT}/train.txt"; exit 1; }

          EXP_TS="$(date +%Y%m%d_%H%M%S)"
          RUN_ROOT="/mnt/SINDyffuse/results/sindy_text_run_${EXP_TS}"
          mkdir -p "${RUN_ROOT}"

          python train_sindy.py \
            --data_root "${HUMANML3D_ROOT}" \
            --output "${RUN_ROOT}"

          {
            echo "model=sindy_text"
            echo "run_root=${RUN_ROOT}"
            echo "entrypoint=/mnt/SINDyffuse/train_sindy.py"
            echo "completed_at=$(date -Iseconds)"
          } > "${RUN_ROOT}/RUN_INFO.txt"

          echo "Done. Training finished via train_sindy.py."
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: 64Gi
            cpu: "16"
          requests:
            nvidia.com/gpu: 1
            memory: 64Gi
            cpu: "16"
        volumeMounts:
        - name: biomech-ai
          mountPath: /mnt
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: biomech-ai
        persistentVolumeClaim:
          claimName: biomech-ai
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
