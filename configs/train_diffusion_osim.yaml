apiVersion: batch/v1
kind: Job
metadata:
  name: sindyffuse-diffusion-train-osim
spec:
  backoffLimit: 0
  template:
    metadata:
      name: sindyffuse-diffusion-train-osim
    spec:
      restartPolicy: Never
      containers:
      - name: sindyffuse-diffusion
        image: ncking/bige:latest
        workingDir: /mnt
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        - name: HUMANML3D_ROOT
          value: "/mnt/BiomechAI/datasets/HumanML3D"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -eo pipefail
          eval "$(conda shell.bash hook)"
          set +u
          conda activate base
          set -u

          ENV_NAME="hml3d-diffusion"
          ENV_FILE="/mnt/BiomechAI/experiments/hml3d_diffusion_postgen/environment.yaml"
          if conda env list | grep -Eq "^(\*| )*[[:space:]]*${ENV_NAME}[[:space:]]"; then
            conda env update -n "${ENV_NAME}" -f "${ENV_FILE}" --prune
          else
            conda env create -n "${ENV_NAME}" -f "${ENV_FILE}"
          fi
          set +u
          conda activate "${ENV_NAME}"
          set -u
          export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir git+https://github.com/openai/CLIP.git

          cd /mnt/SINDyffuse

          test -f "${HUMANML3D_ROOT}/train.txt" || { echo "Missing ${HUMANML3D_ROOT}/train.txt"; exit 1; }

          EXP_TS="$(date +%Y%m%d_%H%M%S)"
          RUN_ROOT="/mnt/SINDyffuse/results/diffusion_osim_run_${EXP_TS}"
          mkdir -p "${RUN_ROOT}"

          RESOLVED_CFG="${RUN_ROOT}/train_diffusion_osim.json"
          export RESOLVED_CFG
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          base = Path("/mnt/SINDyffuse/configs/train_diffusion.json")
          out = Path(os.environ["RESOLVED_CFG"])
          cfg = json.loads(base.read_text(encoding="utf-8"))
          cfg.setdefault("train", {})["guidance"] = "osim"
          cfg.setdefault("data", {})["data_root"] = "/mnt/BiomechAI/datasets/HumanML3D"
          out.write_text(json.dumps(cfg, indent=2), encoding="utf-8")
          print(f"wrote {out}")
          print("resolved_data_root=", cfg.get("data", {}).get("data_root"))
          PY

          python train_diffusion.py \
            --config "${RESOLVED_CFG}" \
            --out_dir "${RUN_ROOT}"

          {
            echo "model=sindyffuse_diffusion"
            echo "guidance=osim"
            echo "run_root=${RUN_ROOT}"
            echo "config=${RESOLVED_CFG}"
            echo "completed_at=$(date -Iseconds)"
          } > "${RUN_ROOT}/RUN_INFO.txt"

          echo "Done. Results written under ${RUN_ROOT}"
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: 64Gi
            cpu: "16"
          requests:
            nvidia.com/gpu: 1
            memory: 64Gi
            cpu: "16"
        volumeMounts:
        - name: biomech-ai
          mountPath: /mnt
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: biomech-ai
        persistentVolumeClaim:
          claimName: biomech-ai
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
